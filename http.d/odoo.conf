server {
    listen 8443;
    server_name 192.168.1.10;

    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # Seu proxy para o Odoo (já existente)
    location / {
        proxy_pass http://192.168.1.3:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint que executa o script Lua
    location /update-ip {
        default_type application/json;
        content_by_lua_file /etc/nginx/http.d/check_ip.lua;
    }

    # Location interno para comunicar com o Odoo externo
    location /internal-odoo-update {
        internal;  # só pode ser chamado via ngx.location.capture
        proxy_pass https://odoo.mandingamirim.com.br/update-ip;
        proxy_set_header Host odoo.mandingamirim.com.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_verify off;  # se o certificado do Odoo for autoassinado
        # Se precisar de resolvedor DNS, descomente e ajuste:
        # resolver 8.8.8.8;
    }
}
